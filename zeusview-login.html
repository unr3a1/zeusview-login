<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>ZeusView — AI-powered property reports</title>
  <style>
    :root { --navy:#07184b; --yellow:#ffd400; --ink:#101a3b; --muted:#7b849e; --line:#e6e9f1; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#fff; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height:100vh; overflow-x:hidden; }
    #mesh { position:fixed; inset:-5%; width:110%; height:110%; z-index:1; pointer-events:none; }
    .mesh-wash { position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(circle at 50% 48%, rgba(255,255,255,.90) 0 23%, rgba(255,255,255,.56) 54%, rgba(255,255,255,.18) 100%); }
    .page { position:relative; z-index:2; width:min(100%, 390px); min-height:100svh; margin:0 auto; display:flex; flex-direction:column; padding:24px 24px 16px; overflow:hidden; }
    header { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; color:var(--navy); text-decoration:none; font-weight:800; letter-spacing:-.055em; font-size:22px; }
    .header-note { color:#8b93a8; font-size:12px; letter-spacing:.04em; }
    main { flex:1; display:grid; place-items:center; padding:20px 0 28px; }
    .login-card { width:min(100%, 430px); text-align:center; }
    .stacked-logo { display:block; width:min(100%, 250px); height:auto; margin:0 auto 28px; mix-blend-mode:multiply; filter:drop-shadow(0 0 5px rgba(255,255,255,.98)) drop-shadow(0 0 13px rgba(255,255,255,.86)); }
    .eyebrow { margin:0 0 14px; color:var(--navy); font-weight:800; font-size:31px; letter-spacing:-.07em; line-height:1.02; }
    .subtitle { display:none; }
    .auth-stack { display:grid; gap:10px; }
    .auth-btn { appearance:none; width:100%; height:52px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.92); color:#182142; display:flex; align-items:center; justify-content:center; gap:11px; font:600 14px inherit; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; box-shadow:0 5px 18px rgba(11,29,78,.045); }
    .auth-btn:hover { transform:translateY(-2px); border-color:#cdd3e1; box-shadow:0 10px 24px rgba(11,29,78,.09); }
    .auth-btn:focus-visible { outline:3px solid rgba(255,212,0,.55); outline-offset:3px; }
    .auth-btn.email { color:#fff; border-color:var(--navy); background:var(--navy); box-shadow:0 9px 22px rgba(7,24,75,.19); }
    .auth-btn.email:hover { border-color:#102b79; background:#102b79; }
    .icon { width:18px; height:18px; flex:0 0 auto; }
    .divider { display:flex; align-items:center; gap:12px; margin:23px 0 17px; color:#a2a9bb; font-size:11px; }
    .divider::before, .divider::after { content:""; height:1px; flex:1; background:#e9ebf1; }
    .legal { margin:18px auto 0; color:#9aa1b3; font-size:10px; line-height:1.65; max-width:330px; }
    .legal a { color:#68718e; text-underline-offset:2px; }
    footer { display:flex; justify-content:space-between; align-items:end; color:#a2a9b8; font-size:10px; letter-spacing:.04em; }
    .status { display:flex; align-items:center; gap:7px; }
    .status::before { content:""; width:6px; height:6px; border-radius:50%; background:#62c99a; box-shadow:0 0 0 3px rgba(98,201,154,.13); }
    @media (min-width:500px) { body { background:#eef1f6; } .page { min-height:844px; margin:22px auto; border-radius:28px; box-shadow:0 18px 50px rgba(8,24,75,.12); } }
    @media (max-width:389px) { .page { min-height:100svh; padding-left:20px; padding-right:20px; } .stacked-logo { width:min(100%, 240px); } }
    @media (max-width:560px) { .header-note { display:none; } footer { font-size:9px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
  </style>
</head>
